name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # the SMB server the executable embeds
      - name: Fetch the bundled SMB server
        shell: pwsh
        run: ./scripts/fetch-smb-server.ps1

      - name: Build
        run: dotnet build VirtualFileSystems.sln -c Release
